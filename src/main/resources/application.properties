# 비밀번호는 코드/파일에 쓰지 않고 환경변수로 주입
spring.datasource.url=jdbc:mysql://localhost:3308/batchdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&logger=Slf4JLogger&profileSQL=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 관리자 화면 로그인 계정 (admin.html, /api/admin/**)
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# 수동 실행 알림 메일 (MAIL_PASSWORD 미설정 시 콘솔 시뮬레이션)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.admin-to=${MAIL_TO:}
