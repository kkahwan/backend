# 비밀번호는 코드/파일에 쓰지 않고 환경변수로 주입
spring.datasource.url=jdbc:mysql://localhost:3308/batchdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&logger=Slf4JLogger&profileSQL=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# 관리자 화면 로그인 계정 (admin.html, /api/admin/**)
spring.security.user.name=${ADMIN_USERNAME:admin}
spring.security.user.password=${ADMIN_PASSWORD}

# 수동 실행 알림 메일 (MAIL_PASSWORD 미설정 시 콘솔 시뮬레이션)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.admin-to=${MAIL_TO:}

# 토스페이먼츠 결제위젯 (테스트 모드). 키가 없으면 토스 문서에 공개된 테스트 키 사용 -> 실제 돈은 나가지 않음
# 내 테스트 키: 개발자센터(developers.tosspayments.com) -> API 키 -> 결제위젯 연동 키 (test_gck_ / test_gsk_)
toss.client-key=${TOSS_CLIENT_KEY:test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm}
toss.secret-key=${TOSS_SECRET_KEY:test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6}
# 외부 API(토스) 호출 타임아웃
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=30s
