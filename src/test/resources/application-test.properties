# 테스트(@ActiveProfiles("test"))는 MySQL 없이 메모리 H2(MySQL 모드)로
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_UPPER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

spring.security.user.name=admin
spring.security.user.password=admin-pw

# 구글 로그인 켜진 상태로 테스트 (실제 구글 호출은 하지 않음)
GOOGLE_CLIENT_ID=test-client
GOOGLE_CLIENT_SECRET=test-secret

